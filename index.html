<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: two views — a deck list grouped by source (GregMat / Claude), and a one-screen study view with the index card centred and grading buttons at the bottom */
:root{
  --paper:#eef1f5; --card:#ffffff; --ink:#18223a; --muted:#5d6782; --line:#d5dbe6;
  --accent:#b9792a; --again:#c2413b; --good:#2f6fb5; --easy:#2c8a5a; --chip:#e2e7f0; --sel:#fbf1e3;
  --display:"Literata",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151f; --card:#1b2130; --ink:#e7ebf3; --muted:#97a1b8; --line:#2c3446;
  --accent:#e0a253; --again:#e06a63; --good:#6aa3e6; --easy:#58bf8a; --chip:#262e40; --sel:#2e2a22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151f; --card:#1b2130; --ink:#e7ebf3; --muted:#97a1b8; --line:#2c3446;
  --accent:#e0a253; --again:#e06a63; --good:#6aa3e6; --easy:#58bf8a; --chip:#262e40; --sel:#2e2a22; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font-family:var(--body)}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding-block:14px}
.app.study{height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.icon-btn{background:var(--chip);color:var(--ink);border:0;border-radius:999px;padding:8px 12px;font:500 13px var(--body);cursor:pointer;white-space:nowrap}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:flex;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
/* deck list */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.summary b{display:block;font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted)}
.set{display:flex;flex-direction:column;gap:8px}
.set-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.set-head h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:600}
.set-head button{background:none;border:0;color:var(--accent);font:600 13px var(--body);cursor:pointer;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.deck{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.deck.on{border-color:var(--accent);background:var(--sel);box-shadow:inset 0 0 0 1px var(--accent)}
.deck .nm{font-weight:600;font-size:14px;line-height:1.25}
.deck .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:6px}
.deck .due{color:var(--again);font-weight:600}
.deck .mini{height:3px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.deck .mini i{height:100%;background:var(--accent)} .deck .mini u{height:100%;background:var(--muted);opacity:.45}
.go{position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 70%,transparent);margin-top:auto}
.go button{width:100%;border:0;border-radius:12px;padding:15px;background:var(--ink);color:var(--paper);font:600 16px var(--body);cursor:pointer}
.go button:disabled{opacity:.35;cursor:default}
.go small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:2px}
/* study */
.stage{flex:1;min-height:0;display:flex;perspective:1200px}
.card{flex:1;position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);cursor:pointer;outline:none}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:24px 22px;display:flex;flex-direction:column;
  box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(20,30,60,.35);overflow:auto}
.face::before{content:"";position:absolute;left:0;right:0;top:64px;border-top:2px solid var(--again);opacity:.35}
.back{transform:rotateY(180deg)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);height:20px}
.box-dots{display:flex;gap:4px;align-items:center}
.box-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.box-dots i.on{background:var(--accent)}
.front-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.word{font-family:var(--display);font-size:clamp(32px,10vw,46px);font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.pos{font-family:var(--display);font-style:italic;color:var(--muted);font-size:17px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}
.front-def{font-family:var(--display);font-size:22px;line-height:1.4;text-wrap:balance;margin:0}
.back-main{flex:1;display:flex;flex-direction:column;gap:16px;padding-top:28px}
.back .word{font-size:28px;text-align:left}
.def{font-size:19px;line-height:1.5;margin:0}
.it{margin:0;font-size:18px;font-weight:600;color:var(--accent);display:flex;gap:8px;align-items:baseline;line-height:1.35}
.it span{font-size:10px;letter-spacing:.08em;border:1px solid var(--accent);border-radius:4px;padding:1px 4px;flex:none;position:relative;top:-2px}
.ex{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.5;color:var(--muted);margin:0;padding-left:12px;border-left:2px solid var(--accent)}
.ex b{color:var(--ink);font-style:normal;font-weight:600}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:env(safe-area-inset-bottom,0px)}
.grade button{border:0;border-radius:12px;padding:14px 6px;font:600 16px var(--body);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.grade button small{font-weight:400;font-size:11px;opacity:.85}
.grade .a{background:var(--again)} .grade .g{background:var(--good)} .grade .e{background:var(--easy)}
.grade .reveal{grid-column:1/-1;background:var(--ink);color:var(--paper)}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.done h2{font-family:var(--display);font-size:28px;margin:0}
.done p{color:var(--muted);margin:0;max-width:32ch;line-height:1.5}
.sheet{position:fixed;inset:0;background:rgba(10,14,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-in{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-family:var(--display);font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;flex-wrap:wrap}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 10px;border-radius:8px;font:500 13px var(--body);cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.danger{background:transparent;border:1px solid var(--again);color:var(--again);border-radius:10px;padding:10px;font:500 14px var(--body);cursor:pointer}
.legend{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
</style>

<div class="app" id="app"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <h3>Settings</h3>
    <div class="row"><span>Card front</span>
      <div class="seg" id="modeSeg"><button type="button" data-v="word">Word</button><button type="button" data-v="def">Definition</button></div></div>
    <div class="row"><span>New words per day</span>
      <div class="seg" id="newSeg"><button type="button" data-v="10">10</button><button type="button" data-v="20">20</button><button type="button" data-v="30">30</button><button type="button" data-v="50">50</button></div></div>
    <p class="legend"><b>Again</b> brings the card back in a few minutes. <b>Good</b> moves it up one box, <b>Easy</b> two. Box intervals: 1, 2, 4, 8, 16 days. A word that appears in several decks shares one progress record. Progress is saved in this browser on this device.</p>
    <button class="danger" id="resetBtn" type="button">Reset all progress</button>
    <button class="icon-btn" id="closeBtn" type="button" style="padding:12px">Done</button>
  </div>
</div>

:"GregMat","n":"Group 36","w":["accord","ad hoc","adhere","all-encompassing","aphorism","benchmark","blighted","content","debase","disconcerting","extant","facility","fitful","incite","induce","infelicity","intelligible","makeshift","onetime","opportunistic","plausible","posturing","potent","redundant","sacrosanct","shrewd","unadorned","valedictory","warranted","wistful"]},{"id":"g37","set":"GregMat","n":"Group 37","w":["attribute","calamitous","censor","champion","compound","deter","dexterous","dictum","dutiful","empathetic","ensue","fathom","frank","germane","grumble","hidebound","hypocrite","impolitic","insidious","intermediary","passive","raillery","ramble","resent","residual","resolve","surrogate","vilify","wanting","willful","querulous","phony","check"]},{"id":"c1","set":"Claude · September","n":"Agreement & disagreement","w":["acquiesce","concur","dissent","placate","capitulate","mollify","appease","recalcitrant","obstinate","truculent","conciliatory","belligerent","docile","intransigent","assuage","placid","vociferous","acrimonious","placability","amenable"]},{"id":"c2","set":"Claude · September","n":"Speaking & communicating","w":["loquacious","taciturn","garrulous","reticent","laconic","verbose","eloquent","rhetoric","candid","equivocate","terse","glib","vernacular","diatribe","elucidate","ambiguous","cryptic","lucid","colloquial","pithy"]},{"id":"c3","set":"Claude · September","n":"Praise & criticism","w":["laud","extol","denigrate","vilify","censure","disparage","laudable","commend","deprecate","impugn","eulogy","panegyric","excoriate","castigate","malign","venerate","aggrandize","belittle","laudatory","derogatory"]},{"id":"c4","set":"Claude · September","n":"Quantity & size","w":["paucity","dearth","plethora","surfeit","copious","meager","sparse","voluminous","exiguous","prodigious","diminutive","colossal","negligible","superfluous","ample","scant","myriad","abate","proliferate","dwindle"]},{"id":"c5","set":"Claude · September","n":"Behavior & character","w":["austere","frugal","prodigal","magnanimous","pusillanimous","audacious","timorous","indolent","diligent","fastidious","meticulous","capricious","mercurial","stoic","obsequious","sycophant","gregarious","misanthrope","altruistic","avaricious"]},{"id":"c6","set":"Claude · September","n":"Thinking & reasoning","w":["empirical","specious","spurious","cogent","fallacious","corroborate","refute","conjecture","postulate","extrapolate","ambivalent","dogmatic","skeptical","pragmatic","esoteric","abstruse","erudite","perspicacious","discern","obfuscate"]},{"id":"c7","set":"Claude · September","n":"Change & stability","w":["ephemeral","transient","perennial","static","volatile","immutable","malleable","metamorphosis","nascent","obsolete","anachronistic","fluctuate","stagnant","vestige","ossify","transitory","entrenched","fledgling","precarious"]},{"id":"c8","set":"Claude · September","n":"Support, reject, oppose","w":["repudiate","renounce","advocate","endorse","sanction","rebuff","rescind","abrogate","contravene","vindicate","exonerate","culpable","vindictive","ostracize","exculpate","denounce","preclude","thwart","impede","facilitate"]},{"id":"c9","set":"Claude · September","n":"Emotions & moods","w":["melancholy","euphoria","apathy","trepidation","exuberant","morose","despondent","elated","wistful","perturbed","complacent","ambivalence","nostalgic","indifferent","fervent","callous","contrite","exasperated","equanimity"]},{"id":"c10","set":"Claude · September","n":"High-frequency mix","w":["ubiquitous","anomaly","paradox","juxtapose","dichotomy","paradigm","ubiquity","innocuous","pernicious","insidious","ostentatious","pretentious","aesthetic","idiosyncratic","anachronism","inevitable","plausible","redundant"]},{"id":"mix","set":"Claude · Today","n":"Starter set","w":["abate","aberrant","abstain","acumen","admonish","alacrity","alleviate","ambivalent","ameliorate","anachronism","anomaly","antipathy","apathy","appease","arcane","arduous","ascetic","assuage","audacious","austere","banal","belie","bolster","bombastic","burgeon","capricious","castigate","caustic","chicanery","cogent","commensurate","complacent","conciliatory","confound","convoluted","corroborate","credulous","culpable","cursory","dearth","deference","deleterious","denigrate","deride","diatribe","didactic","diffident","dilettante","disparate","dissemble","dogmatic","eclectic","efficacy","effrontery","elicit","empirical","enervate","ephemeral","equivocate","erudite","esoteric","exacerbate","exculpate","extant","facetious","fallacious","fastidious","flout","foment","frugal","garrulous","gregarious","hackneyed","harangue","iconoclast","idiosyncrasy","impetuous","implacable","inchoate","indolent","ineffable","ingenuous","inimical","innocuous","insipid","intransigent","inure","irascible","laconic","laud","loquacious","lucid","magnanimous","malleable","mendacious","meticulous","misanthrope","mitigate","mollify","nascent","obdurate","obsequious","obviate","onerous","opprobrium","ostentatious","paragon","parsimonious","pedantic","penchant","perfidious","perfunctory","pernicious","perspicacious","phlegmatic","placate","plethora","pragmatic","prevaricate","probity","prodigal","proliferate","prosaic","quiescent","quixotic","recalcitrant","recondite","refute","reticent","sagacious","sanguine","soporific","stolid","substantiate","superfluous","taciturn","tenuous","torpor","tractable","truculent","ubiquitous","vacillate","venerate","veracity","verbose","vilify","volatile","zealot"]}]};
const W=DATA.W, DECKS=DATA.decks;
const KEY="gre-flash-v1", DAY=864e5, INT=[0,1,2,4,8,16];
let S={cards:{},mode:"word",newPerDay:20,newDay:"",newDone:0,sel:["g1"]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!Array.isArray(S.sel))S.sel=["g1"];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toDateString();
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let view="home",queue=[],cur=null,flipped=false,doneCount=0;

function rollDay(){if(S.newDay!==today()){S.newDay=today();S.newDone=0;save()}}
function newLeft(){rollDay();return Math.max(0,S.newPerDay-S.newDone)}
function deckStats(d){const now=Date.now();let seen=0,mast=0,due=0;
  for(const w of d.w){const c=S.cards[w];if(c){seen++;if(c.box>=4)mast++;if(c.due<=now)due++}}
  return {seen,mast,due,n:d.w.length}}
function selWords(){const seen=new Set(),out=[];
  for(const d of DECKS)if(S.sel.includes(d.id))for(const w of d.w)if(!seen.has(w)){seen.add(w);out.push(w)}
  return out}
function plan(){const now=Date.now(),due=[],fresh=[];
  for(const w of selWords()){const c=S.cards[w];if(!c)fresh.push(w);else if(c.due<=now)due.push(w)}
  return {due,fresh:fresh.slice(0,newLeft()),freshTotal:fresh.length}}

/* ---------- home ---------- */
function home(){
  view="home";const app=$("app");app.className="app";
  const all=Object.keys(W).length,seen=Object.keys(S.cards).length,
    mast=Object.values(S.cards).filter(c=>c.box>=4).length,now=Date.now(),
    dueAll=Object.values(S.cards).filter(c=>c.due<=now).length;
  const sets=[...new Set(DECKS.map(d=>d.set))];
  const p=plan();
  app.innerHTML=`<header><h1>GRE <span>Vocab</span></h1><button class="icon-btn" id="settingsBtn" type="button">Settings</button></header>
  <div class="summary"><div><b>${dueAll}</b><span>to review</span></div><div><b>${seen}</b><span>seen of ${all}</span></div><div><b>${mast}</b><span>mastered</span></div></div>
  ${sets.map(s=>{const ds=DECKS.filter(d=>d.set===s),allOn=ds.every(d=>S.sel.includes(d.id));
    return `<section class="set"><div class="set-head"><h2>${esc(s)}</h2><button type="button" data-set="${esc(s)}">${allOn?"Clear":"Select all"}</button></div>
    <div class="grid">${ds.map(d=>{const st=deckStats(d),on=S.sel.includes(d.id);
      return `<button type="button" class="deck${on?" on":""}" data-id="${d.id}" aria-pressed="${on}">
        <span class="nm">${esc(d.n)}</span>
        <span class="sub"><span>${st.seen}/${st.n} seen</span>${st.due?`<span class="due">${st.due} due</span>`:st.mast?`<span>${st.mast} ✓</span>`:""}</span>
        <span class="mini"><i style="width:${st.mast/st.n*100}%"></i><u style="width:${(st.seen-st.mast)/st.n*100}%"></u></span></button>`}).join("")}</div></section>`}).join("")}
  <div class="go"><button type="button" id="goBtn" ${p.due.length+p.fresh.length?"":"disabled"}>Study ${S.sel.length} deck${S.sel.length===1?"":"s"}
    <small>${p.due.length} to review · ${p.fresh.length} new today${p.freshTotal>p.fresh.length?` (${p.freshTotal} left in these decks)`:""}</small></button></div>`;
  app.querySelectorAll(".deck").forEach(b=>b.onclick=()=>{const id=b.dataset.id;
    S.sel=S.sel.includes(id)?S.sel.filter(x=>x!==id):S.sel.concat(id);save();keepScroll(home)});
  app.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{const ids=DECKS.filter(d=>d.set===b.dataset.set).map(d=>d.id),allOn=ids.every(i=>S.sel.includes(i));
    S.sel=allOn?S.sel.filter(x=>!ids.includes(x)):[...new Set(S.sel.concat(ids))];save();keepScroll(home)});
  $("goBtn").onclick=startStudy;
  $("settingsBtn").onclick=openSettings;
}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}

/* ---------- study ---------- */
function startStudy(){const p=plan();queue=p.due.sort(()=>Math.random()-.5).concat(p.fresh);doneCount=0;
  view="study";const app=$("app");app.className="app study";window.scrollTo(0,0);
  app.innerHTML=`<header><button class="icon-btn" id="backBtn" type="button">← Decks</button><h1>GRE <span>Vocab</span></h1><button class="icon-btn" id="settingsBtn" type="button">Settings</button></header>
  <div class="stats" id="stats"></div><div class="bar"><i id="bar"></i></div><div class="stage" id="stage"></div><div class="grade" id="grade"></div>`;
  $("backBtn").onclick=home;$("settingsBtn").onclick=openSettings;next()}
function stats(){const total=doneCount+queue.length+(cur!==null?1:0);
  $("stats").innerHTML=`<span><b>${queue.length+(cur!==null?1:0)}</b> left in this session</span>·<span><b>${doneCount}</b> answered</span>`;
  $("bar").style.width=(total?doneCount/total*100:0)+"%"}
function next(){cur=queue.length?queue.shift():null;flipped=false;render()}
function dots(b){return `<span class="box-dots" title="Box ${b} of 5">${[1,2,3,4,5].map(n=>`<i class="${n<=b?"on":""}"></i>`).join("")}</span>`}
function highlight(ex,w){let e=esc(ex);const stem=w.length>5?w.slice(0,w.length-2):w;
  const re=new RegExp("\\b("+stem.replace(/[-\s]/g,"[-\\s]")+"[a-z]*)","i");return e.replace(re,"<b>$1</b>")}
function decksOf(w){return DECKS.filter(d=>d.w.includes(w)).map(d=>d.set==="GregMat"?"GregMat "+d.n.replace("Group ",""):d.n).slice(0,2).join(" · ")}
function render(){stats();
  if(cur===null){$("stage").innerHTML=`<div class="done"><h2>Session done</h2><p>${doneCount?`You answered ${doneCount} cards. `:""}Come back tomorrow for your reviews, or add more decks.</p><button class="icon-btn" id="moreBtn" type="button" style="padding:12px 18px">Back to decks</button></div>`;
    $("grade").innerHTML="";$("moreBtn").onclick=home;return}
  const w=cur,[pos,def,ex,it]=W[w],c=S.cards[w],box=c?c.box:0,tag=c?"Review":"New";
  const front=S.mode==="word"
    ?`<div class="front-main"><p class="word">${esc(w)}</p><span class="pos">${esc(pos)}</span></div><p class="hint">Tap to reveal</p>`
    :`<div class="front-main"><span class="pos">${esc(pos)}</span><p class="front-def">${esc(def)}</p></div><p class="hint">Which word? Tap to reveal</p>`;
  $("stage").innerHTML=`<div class="card" id="card" tabindex="0" role="button" aria-label="Flip card">
    <div class="face"><div class="meta"><span>${tag}</span>${dots(box)}</div>${front}</div>
    <div class="face back"><div class="meta"><span>${esc(decksOf(w))}</span>${dots(box)}</div>
      <div class="back-main"><p class="word">${esc(w)}</p><span class="pos" style="margin-top:-10px">${esc(pos)}</span><p class="it"><span>IT</span>${esc(it)}</p><p class="def">${esc(def)}</p>${ex?`<p class="ex">${highlight(ex,w)}</p>`:""}</div></div></div>`;
  $("card").onclick=flip;
  $("card").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}};
  gradeBar()}
function gradeBar(){
  if(!flipped){$("grade").innerHTML=`<button class="reveal" type="button" id="rev">Show answer</button>`;$("rev").onclick=flip;return}
  const c=S.cards[cur],b=c?c.box:0,lab=n=>n<=0?"soon":INT[Math.min(n,5)]+"d";
  $("grade").innerHTML=`<button class="a" type="button" data-g="0">Again<small>${lab(0)}</small></button><button class="g" type="button" data-g="1">Good<small>${lab(b+1)}</small></button><button class="e" type="button" data-g="2">Easy<small>${lab(b+2)}</small></button>`;
  $("grade").querySelectorAll("button").forEach(x=>x.onclick=()=>grade(+x.dataset.g))}
function flip(){flipped=!flipped;$("card").classList.toggle("flipped",flipped);gradeBar()}
function grade(g){const w=cur,isNew=!S.cards[w];let c=S.cards[w]||{box:0,due:0};
  if(isNew){rollDay();S.newDone++}
  if(g===0){c.box=0;c.due=Date.now();queue.splice(Math.min(3,queue.length),0,w)}
  else{c.box=Math.min(5,c.box+g);const d=new Date();d.setHours(4,0,0,0);c.due=d.getTime()+INT[c.box]*DAY}
  S.cards[w]=c;save();doneCount++;next()}
document.addEventListener("keydown",e=>{if(view!=="study"||!$("sheet").hidden||cur===null)return;
  if(flipped&&["1","2","3"].includes(e.key))grade(+e.key-1)});

/* ---------- settings ---------- */
function seg(id,key,val){$(id).querySelectorAll("button").forEach(b=>{b.classList.toggle("on",b.dataset.v==String(S[key]));
  b.onclick=()=>{S[key]=val(b.dataset.v);save();seg(id,key,val);if(view==="study"&&key==="mode")render()}})}
function openSettings(){seg("modeSeg","mode",v=>v);seg("newSeg","newPerDay",v=>+v);$("resetBtn").textContent="Reset all progress";delete $("resetBtn").dataset.c;$("sheet").hidden=false}
function closeSettings(){$("sheet").hidden=true;if(view==="home")home()}
$("closeBtn").onclick=closeSettings;
$("sheet").onclick=e=>{if(e.target.id==="sheet")closeSettings()};
$("resetBtn").onclick=e=>{const b=e.target;if(b.dataset.c){S.cards={};S.newDone=0;save();closeSettings();home()}else{b.dataset.c=1;b.textContent="Tap again to confirm reset"}};
home();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
